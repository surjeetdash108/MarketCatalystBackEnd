# Cloud Run environment variables for the STAGE worker (non-secret only — API
# keys come from Secret Manager via --set-secrets).
#
# Identical to deploy/env.production.yaml EXCEPT FIREBASE_PROJECT_ID, which
# points at the stage Firebase project so the stage backend reads/writes the
# stage database and never touches prod.
#
# Deploy with:  gcloud run deploy ... --env-vars-file=deploy/env.stage.yaml
#               --service-account backend-runtime@market-catalyst-stage.iam.gserviceaccount.com

NODE_ENV: "production"

# ─── Service role (app.module.ts) ─────────────────────────────────────────────
# Worker role: private (--no-allow-unauthenticated), runs the @Cron sync jobs
# and mounts the admin controllers + ops monitor. The live service runs the same
# image with APP_ROLE=live and does NOT use this file. See deploy/DEPLOY.md §3b.
APP_ROLE: "worker"

# Read by firebase-admin.provider.ts and passed to initializeApp(). The stage
# backend authenticates via ADC (the backend-runtime@market-catalyst-stage
# runtime SA, granted roles/datastore.user) — no key file, matching prod.
FIREBASE_PROJECT_ID: "market-catalyst-stage"

# ─── Polygon / Massive ────────────────────────────────────────────────────────
POLYGON_API_BASE_URL: "https://api.massive.com"

# MUST be 0 on a paid plan — see deploy/env.production.yaml for the full
# rationale. At the code default (12500) several jobs exceed the 900s Cloud Run
# and Scheduler deadlines and fail every run.
POLYGON_PAGE_DELAY_MS: "0"

# ─── Vendor routing (adapters.module.ts) ──────────────────────────────────────
COMPANY_PROFILE_SOURCE: "polygon"
COMPANY_PROFILE_FALLBACK_SOURCE: "none"
MOVER_ENRICHMENT_SOURCE: "polygon"
MOVER_ENRICHMENT_FALLBACK_SOURCE: "none"
MOVERS_SOURCE: "polygon"
MOVERS_FALLBACK_SOURCE: "none"
NEWS_SOURCE: "polygon"
DIVIDENDS_SOURCE: "polygon"
DIVIDENDS_FALLBACK_SOURCE: "none"
IPOS_SOURCE: "polygon"
IPOS_FALLBACK_SOURCE: "none"
SECTORS_SOURCE: "polygon"
SECTORS_FALLBACK_SOURCE: "none"
QUOTE_SOURCE: "polygon"
QUOTE_FALLBACK_SOURCE: "none"

# Single-vendor seams — only Polygon implements these today.
MARKET_BARS_SOURCE: "polygon"
MARKET_BARS_FALLBACK_SOURCE: "none"
TICKER_UNIVERSE_SOURCE: "polygon"
TICKER_UNIVERSE_FALLBACK_SOURCE: "none"
FINANCIALS_SOURCE: "polygon"
FINANCIALS_FALLBACK_SOURCE: "none"

# ─── SEC ──────────────────────────────────────────────────────────────────────
SEC_EDGAR_USER_AGENT: "Market Catalyst Backend (stage) hello@inc108.com"

# Data retention (delivery-plan R5). Weekly prune of append-only history.
RETENTION_DRY_RUN: "false"
# Auto-purge of stale ephemeral data, nightly at midnight ET.
AUTO_PURGE_DRY_RUN: "false"

# Admin authorization. Same fixed admin account as prod.
ADMIN_EMAIL: "admin@marketcatalyst.ai"
ADMIN_GUARD_TRUST_IAM: "true"
