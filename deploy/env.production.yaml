# Cloud Run environment variables (non-secret only — API keys come from Secret
# Manager via --set-secrets).
#
# Deploy with:  gcloud run deploy ... --env-vars-file=deploy/env.production.yaml
#
# Kept as a file rather than a --set-env-vars string because there are ~25 of
# them and that flag is comma-delimited, so any value containing a comma
# silently corrupts the whole set.

NODE_ENV: "production"

# ─── Service role (app.module.ts) ─────────────────────────────────────────────
# THIS FILE IS THE WORKER'S ENV. The worker is private
# (--no-allow-unauthenticated), runs every @Cron sync job and mounts the admin
# controllers plus the ops monitor at /.
#
# The second service, market-catalyst-live, runs the SAME IMAGE with
# APP_ROLE=live and does NOT use this file — it is public so browsers can open
# the ticker-tape SSE stream, and it mounts ONLY LiveModule + /health. Do not
# add APP_ROLE=live here, and do not point the live service at this file: it
# would inherit ADMIN_GUARD_TRUST_IAM below, which combined with
# --allow-unauthenticated grants anonymous access to /purge and /sync. See
# deploy/DEPLOY.md §3b.
APP_ROLE: "worker"

# Read by firebase-admin.provider.ts and passed to initializeApp(). Lives here
# rather than in a --set-env-vars flag because gcloud treats --env-vars-file and
# --set-env-vars as MUTUALLY EXCLUSIVE — passing both makes the deploy fail with
# a bare usage dump and no explanation.
FIREBASE_PROJECT_ID: "market-catalyst-502415"

# ─── Polygon / Massive ────────────────────────────────────────────────────────
# Polygon rebranded to Massive; both hosts verified working on 2026-07-20.
POLYGON_API_BASE_URL: "https://api.massive.com"

# MUST be 0 on a paid plan — this is not a tuning knob, it is a deploy blocker.
# The code default is 12500 (the FREE tier's 5-calls-per-minute budget). At that
# value:
#   options-chains       168 sleeps -> ~35 min  (exceeds the 900s Cloud Run
#                                                timeout AND the 900s Scheduler
#                                                deadline -> fails EVERY run)
#   stock-history         60 sleeps -> ~12.5 min before any API time
#   fundamentals-growth   60 sleeps -> ~12.5 min before any API time
# Every paid Massive tier is unlimited (verified: 12 parallel calls, zero 429s).
POLYGON_PAGE_DELAY_MS: "0"

# ─── Vendor routing (adapters.module.ts) ──────────────────────────────────────
# Set a *_FALLBACK_SOURCE to "none" to run a domain single-source without losing
# the ability to switch vendors later — every implementation stays registered.
COMPANY_PROFILE_SOURCE: "polygon"
COMPANY_PROFILE_FALLBACK_SOURCE: "none"
MOVER_ENRICHMENT_SOURCE: "polygon"
MOVER_ENRICHMENT_FALLBACK_SOURCE: "none"
MOVERS_SOURCE: "polygon"
MOVERS_FALLBACK_SOURCE: "none"
# Polygon-only, NOT "aggregate". We hold a Massive/Polygon REDISTRIBUTION
# licence; Finnhub is not licensed for redistribution, so merging its articles
# into a feed served to users would be a licence breach. Polygon's
# /v2/reference/news is authorised and is the sole news source in production.
NEWS_SOURCE: "polygon"
DIVIDENDS_SOURCE: "polygon"
DIVIDENDS_FALLBACK_SOURCE: "none"
IPOS_SOURCE: "polygon"
IPOS_FALLBACK_SOURCE: "none"
SECTORS_SOURCE: "polygon"
# FMP as fallback only — its GICS labels differ from the ETF-proxy labels the UI
# matches on, so not primary until verified (Doc/FMP-INTEGRATION.md Tier 2A).
SECTORS_FALLBACK_SOURCE: "fmp"
QUOTE_SOURCE: "polygon"
QUOTE_FALLBACK_SOURCE: "none"

# ─── FMP-backed gap-fillers (supplementary; Doc/FMP-INTEGRATION.md) ────────────
# Data Polygon has no feed for — FMP is the primary source for these.
EARNINGS_ESTIMATES_SOURCE: "fmp"
ANALYST_SOURCE: "fmp"
# Per-run cursor batch for the per-ticker jobs. 150 covers the ~385-ticker
# universe in ~3 runs (and keeps nightly full-refresh to ~3 nights) while staying
# inside the 900s request timeout (~2.5s/ticker). Lower to 40 to revert.
FINANCIALS_BATCH_SIZE: "150"
ANALYST_BATCH_SIZE: "150"

# Single-vendor seams — only Polygon implements these today.
MARKET_BARS_SOURCE: "polygon"
MARKET_BARS_FALLBACK_SOURCE: "none"
TICKER_UNIVERSE_SOURCE: "polygon"
TICKER_UNIVERSE_FALLBACK_SOURCE: "none"
FINANCIALS_SOURCE: "polygon"
FINANCIALS_FALLBACK_SOURCE: "none"

# ─── SEC ──────────────────────────────────────────────────────────────────────
# SEC requires a descriptive User-Agent with a real contact address; a
# non-contactable UA risks being rate-limited or blocked.
SEC_EDGAR_USER_AGENT: "Market Catalyst Backend hello@inc108.com"
# Data retention (delivery-plan R5). Weekly prune of append-only history.
# Ships in DRY-RUN: the scheduled job and /retention/run only REPORT what they
# would delete until this is flipped to "false" after reviewing the counts.
RETENTION_DRY_RUN: "false"
# Auto-purge of stale ephemeral data (market_movers/options_chains fallen-off
# entries), nightly at midnight ET. Deletes docs older than (latest updatedAt −
# 12h), so the current batch always survives. "true" = preview only.
AUTO_PURGE_DRY_RUN: "false"
# Admin authorization. ADMIN_EMAIL is the single fixed admin account.
# ADMIN_GUARD_TRUST_IAM=true accepts Google OIDC tokens that Cloud Run IAM has
# already verified (Cloud Scheduler + gcloud proxy). If the service is ever made
# --allow-unauthenticated, set this to "false" so ONLY a verified Firebase admin
# token is accepted.
ADMIN_EMAIL: "admin@marketcatalyst.ai"
ADMIN_GUARD_TRUST_IAM: "true"
