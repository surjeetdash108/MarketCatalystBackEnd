# Firebase App Hosting config for the PROD worker backend (.firebaserc "prod"
# and "default" both point at market-catalyst-502415). This is a SEPARATE
# config surface from gcloud run deploy — App Hosting does not read
# deploy/env.*.yaml, does not use the root Dockerfile, and does not honor
# --set-secrets. Everything the app needs at runtime must be declared here.
#
# Stage deploys to market-catalyst-stage are on hold for now — see
# .firebaserc's "stage" alias when that resumes.
#
# Secrets referenced below must already exist in Secret Manager for this
# project and be granted to the App Hosting backend's service account:
#   firebase apphosting:secrets:set POLYGON_API_KEY --project market-catalyst-502415
#   firebase apphosting:secrets:grantaccess POLYGON_API_KEY --backend <BACKEND_ID> --project market-catalyst-502415
# (repeat for FMP_API_KEY, FINNHUB_API_KEY, FRED_API_KEY)

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpuMiB: 1000
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: "production"

  # ─── Service role (src/app.module.ts) ────────────────────────────────────────
  # This backend is the WORKER: runs the @Cron/Scheduler-triggered sync jobs and
  # mounts the admin controllers + ops monitor at /. Do NOT set APP_ROLE=live
  # here — see deploy/DEPLOY.md §3b for why the public "live" role must stay a
  # separate backend/config.
  - variable: APP_ROLE
    value: "worker"

  # Selects the Firestore project this backend reads/writes. Must match the UI's
  # NEXT_PUBLIC_FIREBASE_PROJECT_ID for prod.
  - variable: FIREBASE_PROJECT_ID
    value: "market-catalyst-502415"

  # ─── Polygon / Massive ────────────────────────────────────────────────────────
  - variable: POLYGON_API_BASE_URL
    value: "https://api.massive.com"
  # MUST be 0 on a paid plan — see deploy/env.production.yaml for the full
  # rationale. Non-zero makes several jobs exceed platform timeouts.
  - variable: POLYGON_PAGE_DELAY_MS
    value: "0"

  # ─── Vendor routing (src/adapters/adapters.module.ts) ────────────────────────
  # Every domain is single-sourced on Polygon/Massive; FALLBACK "none" keeps the
  # other adapters registered so a vendor can be switched later without a code
  # change. Mirrors deploy/env.production.yaml.
  - variable: COMPANY_PROFILE_SOURCE
    value: "polygon"
  - variable: COMPANY_PROFILE_FALLBACK_SOURCE
    value: "none"
  - variable: MOVER_ENRICHMENT_SOURCE
    value: "polygon"
  - variable: MOVER_ENRICHMENT_FALLBACK_SOURCE
    value: "none"
  - variable: MOVERS_SOURCE
    value: "polygon"
  - variable: MOVERS_FALLBACK_SOURCE
    value: "none"
  # Polygon-only, NOT "aggregate": we hold a Massive/Polygon redistribution
  # licence but not one for Finnhub, so merging its articles would breach it.
  - variable: NEWS_SOURCE
    value: "polygon"
  - variable: DIVIDENDS_SOURCE
    value: "polygon"
  - variable: DIVIDENDS_FALLBACK_SOURCE
    value: "none"
  - variable: IPOS_SOURCE
    value: "polygon"
  - variable: IPOS_FALLBACK_SOURCE
    value: "none"
  - variable: SECTORS_SOURCE
    value: "polygon"
  - variable: SECTORS_FALLBACK_SOURCE
    value: "none"
  - variable: QUOTE_SOURCE
    value: "polygon"
  - variable: QUOTE_FALLBACK_SOURCE
    value: "none"
  - variable: MARKET_BARS_SOURCE
    value: "polygon"
  - variable: MARKET_BARS_FALLBACK_SOURCE
    value: "none"
  - variable: TICKER_UNIVERSE_SOURCE
    value: "polygon"
  - variable: TICKER_UNIVERSE_FALLBACK_SOURCE
    value: "none"
  - variable: FINANCIALS_SOURCE
    value: "polygon"
  - variable: FINANCIALS_FALLBACK_SOURCE
    value: "none"

  # ─── SEC EDGAR ───────────────────────────────────────────────────────────────
  # SEC requires a descriptive User-Agent with a real contact address.
  - variable: SEC_EDGAR_USER_AGENT
    value: "Market Catalyst Backend hello@inc108.com"

  # ─── Data lifecycle jobs ─────────────────────────────────────────────────────
  - variable: RETENTION_DRY_RUN
    value: "false"
  - variable: AUTO_PURGE_DRY_RUN
    value: "false"

  # ─── Admin authorization (src/common/admin.guard.ts) ─────────────────────────
  # The single fixed admin account for /sync, /purge, /retention, feature-flags.
  - variable: ADMIN_EMAIL
    value: "admin@marketcatalyst.ai"

  # CRITICAL: this OVERRIDES deploy/env.production.yaml, which sets "true".
  #
  # "true" means "trust that Cloud Run IAM already vetted the caller" — correct
  # ONLY for the private (--no-allow-unauthenticated) gcloud worker. Firebase App
  # Hosting serves this backend PUBLICLY (ingress: all, no IAM in front), so with
  # trust-IAM on, the guard would accept ANY anonymous request to /purge and
  # /sync. Forcing "false" makes those endpoints require a verified Firebase
  # admin ID token instead — the only thing standing between the internet and
  # the purge/sync controllers on a public service.
  - variable: ADMIN_GUARD_TRUST_IAM
    value: "false"

  # ─── Secrets (Google Secret Manager) ─────────────────────────────────────────
  # These are the four the worker uses (per deploy/DEPLOY.md --set-secrets). Each
  # MUST already exist in Secret Manager for market-catalyst-502415 and be
  # granted to the backend, or the rollout fails. Create + grant every one first:
  #   firebase apphosting:secrets:set POLYGON_API_KEY  --project market-catalyst-502415
  #   firebase apphosting:secrets:grantaccess POLYGON_API_KEY --backend <BACKEND_ID> --project market-catalyst-502415
  # (repeat for FMP_API_KEY, FINNHUB_API_KEY, FRED_API_KEY)
  - variable: POLYGON_API_KEY
    secret: POLYGON_API_KEY
  - variable: FMP_API_KEY
    secret: FMP_API_KEY
  - variable: FINNHUB_API_KEY
    secret: FINNHUB_API_KEY
  - variable: FRED_API_KEY
    secret: FRED_API_KEY

  # Optional vendors (code warns and no-ops if unset — see the vendor services'
  # onModuleInit). Uncomment once the secret exists for this project.
  # - variable: BENZINGA_API_KEY
  #   secret: BENZINGA_API_KEY
  # - variable: TRADIER_ACCESS_TOKEN
  #   secret: TRADIER_ACCESS_TOKEN
  # - variable: UNUSUAL_WHALES_API_KEY
  #   secret: UNUSUAL_WHALES_API_KEY
  # - variable: SENTRY_DSN
  #   secret: SENTRY_DSN
