runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 200
  minInstances: 0
  maxInstances: 5

scripts:
  buildCommand: npm run build
  runCommand: node dist/main.js

env:
  - variable: NODE_ENV
    value: "production"
    availability: ["RUNTIME"]

  - variable: APP_ROLE
    value: "live"

  - variable: FIREBASE_PROJECT_ID
    value: "market-catalyst-502415"
  - variable: FIRESTORE_DATABASE_ID
    value: "mc-regional"

  - variable: CORS_ORIGINS
    value: "https://marketcatalyst.web.app,https://app.marketcatalyst.ai"

  - variable: ADMIN_GUARD_TRUST_IAM
    value: "false"
  - variable: ADMIN_REQUIRE_EMAIL_VERIFIED
    value: "false"
  - variable: ADMIN_REQUIRE_MFA
    value: "false"

  - variable: MARKET_DATA_PRIMARY
    value: "fmp"
  - variable: LIVE_QUOTE_SOURCE
    value: "fmp"
  - variable: LIVE_QUOTE_FALLBACK_SOURCE
    value: "polygon"
  - variable: LIVE_STREAM_SOURCE
    value: "fmp"
  - variable: EARNINGS_ESTIMATES_SOURCE
    value: "fmp"
  - variable: FINANCIALS_FALLBACK_SOURCE
    value: "fmp"
  - variable: POLYGON_API_BASE_URL
    value: "https://api.massive.com"
  - variable: POLYGON_PAGE_DELAY_MS
    value: "0"
  - variable: LAB_BARS_FROM_STORE
    value: "1"
  - variable: SEC_EDGAR_USER_AGENT
    value: "Market Catalyst Backend hello@inc108.com"

  - variable: OPENROUTER_MODEL
    value: "openrouter/free"
  - variable: OPENROUTER_FALLBACK_MODEL
    value: "google/gemma-4-31b-it:free"

  - variable: POLYGON_API_KEY
    secret: POLYGON_API_KEY
  - variable: FMP_API_KEY
    secret: FMP_API_KEY
  - variable: FRED_API_KEY
    secret: FRED_API_KEY
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
  - variable: GROQ_API_KEY
    secret: GROQ_API_KEY
  - variable: STREAM_TICKET_SECRET
    secret: STREAM_TICKET_SECRET
